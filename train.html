//Run------------------------------------------------
function trainControl(){
	realspeedA+=(accelAnow/timespersecond);
	realspeedB+=(accelBnow/timespersecond);
	if(realspeedA<0){realspeedA=0};
	if(stationstopA&&realspeedA>passSpeedAmax){realspeedA=passSpeedAmax};
	if(realspeedB<0){realspeedB=0};
	if(stationstopB&&realspeedB>passSpeedBmax){realspeedB=passSpeedBmax};
	speedA=realspeedA/0.36/timespersecond;
	speedB=realspeedB/0.36/timespersecond;
	if(gogoRight){trainApos+=speedA};
	if(!Ronly&&gogoLeft){trainBpos-=speedB};
	//signals
	if(signalROK||signalLOK){
	if(signalChanging==2){signalCheck2()}
	if(signalChanging==3){signalCheck3()}
	if(signalChanging==4){signalCheck4()}
	if(signalChanging==5){signalCheck5()}
	}
	//stationR
	if(stationstopA){
		if(crossMovingStart&&stationOK){crossAdist=700}else{crossAdist=2100};
		if(stationstopsecondR[trainAnow]>(9+stopToDooropen)&&crossAzero&&!firstAcrossSpoiler&&crossMovingStart){crossAdist=0}
		if(stopAflag==0&&trainApos>=brakepointA){accelAnow=decelA};
		if(restartflag==1&&realspeedA==0&&gogoRight){stopAflag=1;accelAnow=0;stopAtimer++};
		if(stationstopsecondR[trainAnow]>(9+stopToDooropen)){
			if(stopAtimer==((stationstopsecondR[trainAnow]-7)*timespersecond)){crossAzero=false}
		}
		if(islandPFdoor&&passengerFlag[trainAnow]){
			if(stopAtimer==(stopToDooropen*timespersecond)){doorMoveflag=true;doorControl();};
			if(stopAtimer==(stationstopsecondR[trainAnow]*timespersecond)){doorControl();doorMoveflag=false};
		}
		if(stopAtimer>((stationstopsecondR[trainAnow]+doorcloseToStart)*timespersecond)){accelAnow=accelA};
	}else{//passing
		crossAdist=2100;
		if(trainApos>-(Atrainlength+200)+inNarrowFrameFix&&trainApos<passAreaX){
			realspeedA=passSpeedAnow;
		}else{
			realspeedA=passSpeedAmax;
		}
	}
	//stationL
	if(stationstopB){
		if(crossMovingStart){crossBdist=2100}else if(stationOK){crossBdist=700};
		if(stationstopsecondL[trainBnow]>(9+stopToDooropen)&&crossBzero&&!crossMovingStart){crossBdist=0}
		if(stopBflag==0&&trainBpos<=brakepointB){accelBnow=decelB};
		if(realspeedB==0&&gogoLeft){stopBflag=1;accelBnow=0;stopBtimer++};
		if(stationstopsecondL[trainBnow]>(9+stopToDooropen)){
			if(stopBtimer==((stationstopsecondL[trainBnow]-7)*timespersecond)){crossBzero=false}
		}
		if(passengerFlag[trainBnow]&&(!islandPFdoor)){
			if(stopBtimer==(stopToDooropen*timespersecond)){doorMoveflag=true;doorControl();};
			if(stopBtimer==stationstopsecondL[trainBnow]*timespersecond){doorControl();doorMoveflag=false};
		}
		if(stopBtimer>((stationstopsecondL[trainBnow]+doorcloseToStart)*timespersecond)){accelBnow=accelB};
	}else{//passing
		crossBdist=2100;
		if(trainBpos>-(Btrainlength+200)+inNarrowFrameFix&&trainBpos<passAreaX){
			realspeedB=passSpeedBnow;
		}else{
			realspeedB=passSpeedBmax;
		}
	}
	//crossing
	if((trainBpos<crossingPos+crossingwidth+crossBdist)&&(trainBpos>crossingPos-Btrainlength-5)){e2cross=true;}else{e2cross=false;}
	if((trainApos>crossingPos-Atrainlength-crossAdist)&&(trainApos<crossingPos+crossingwidth+5)){e1cross=true;}else{e1cross=false;}
	if(crossingOK){crossControl()};
	//limit
	if(trainApos>RightEnd){changeAtrain();}
	if(trainBpos<LeftEnd){changeBtrain();}
	//run
	trainAposInt=Math.round(trainApos);
	trainBposInt=Math.round(trainBpos);
	layerMoveX('denshaA',trainAposInt);
	layerMoveX('denshaB',trainBposInt);
	if(glassOK[trainAnow]){layerMoveX('denshaAmado',trainAposInt);}
	if(glassOK[trainBnow]){layerMoveX('denshaBmado',trainBposInt);}
	yscrollCheck();
	xscrollCheck();
	if(scrollspoil){
		scrollTo(0,yyy);//scroll spoil
	}else if(xxx>scrollLimitOffset){
		scrollTo(scrollLimitOffset,yyy);//scroll limit
	}
	startflag=true;
	if(testmode){testcheck()}
	traintimer=setTimeout('trainControl()',1000/timespersecond);

function ji(){
	ima=new Date();
	toki=ima.getTime();
}
testStarttime=0;testEndtime=0;
delaychecktimer=0;delayratio=1;
meterStr="";
function delaychecker(s){
	if(s==0){
		ji();
		testStarttime=toki;
	}else{
		ji();
		testEndtime=toki;
		testTimelength=testEndtime-testStarttime;
		delayratio=testTimelength/500;
		meterNum=Math.round((delayratio-1)*100);
		meterStr=meterNum+"%遅延";if(meterNum<=0){meterStr="遅延なし"}
	}
}
trainAout=false;trainBout=false;
function testcheck(){
	if(delaychecktimer==1){delaychecker(0)}
	if(delaychecktimer>=(timespersecond/2)+1){
		delaychecker(1)
		delaychecktimer=0;
	}
	delaychecktimer++;
	if(trainApos>windowwidthpx+xxx){trainAout=true}else{trainAout=false}
	if(trainBpos+trainLength[trainBnow]<0){trainBout=true}else{trainBout=false}
	if(!trainAout){
		if(realspeedA<=0){
			stopRoffsetPx=(trainAposInt+Atrainlength)-PFrightEnd;
			document.testmeter.RRstopPos.value="駅端と停止位置の差 "+stopRoffsetPx+"px";
		}else{
			document.testmeter.RRstopPos.value="駅停止時に表示";
		}
		document.testmeter.RRlength.value="編成長 "+(Atrainlength/10)+"m";
		document.testmeter.RRnow.value="第"+(trainAnow)+"編成";
		document.testmeter.RRstopSet.value="調整値 "+stopPointSetR[trainAnow]+"px／停止目標 "+(stopPointSetR[trainAnow]-stopOffsetPx)+"px";
		GoOrStopA="通過";if(stationstopA){GoOrStopA="停車 "+(stationstopsecondR[trainAnow]-stopToDooropen)+"秒"}
		document.testmeter.RRstopGo.value=GoOrStopA;
		document.testmeter.RRmaxspeed.value=passingmaxspeed[trainAnow]+"km/h max";
		document.testmeter.RRaccel.value=trainAcceleration[trainAnow]+"km/h/s";
		document.testmeter.RRdecel.value=-trainDeceleration[trainAnow]+"km/h/s";
	}else{
		document.testmeter.RRstopPos.value="";
		document.testmeter.RRlength.value="";
		document.testmeter.RRnow.value="→画面外";
		document.testmeter.RRstopSet.value="";
		document.testmeter.RRstopGo.value="";
		document.testmeter.RRmaxspeed.value="";
		document.testmeter.RRaccel.value="";
		document.testmeter.RRdecel.value="";
	}
	if(!Ronly&&!trainBout){
		if(realspeedB<=0){
			stopLoffsetPx=(trainBposInt+Btrainlength)-PFrightEnd;
			document.testmeter.LLstopPos.value="駅端と停止位置の差 "+stopLoffsetPx+"px";
		}else{
			document.testmeter.LLstopPos.value="駅停止時に表示";
		}
		document.testmeter.LLlength.value="編成長 "+(Btrainlength/10)+"m";
		document.testmeter.LLnow.value="第"+(trainBnow)+"編成"
		document.testmeter.LLstopSet.value="調整値 "+stopPointSetL[trainBnow]+"px／停止目標 "+(stopPointSetL[trainBnow]-stopOffsetPx)+"px";
		GoOrStopB="通過";if(stationstopB){GoOrStopB="停車 "+(stationstopsecondL[trainBnow]-stopToDooropen)+"秒"}
		document.testmeter.LLstopGo.value=GoOrStopB;
		document.testmeter.LLmaxspeed.value=passingmaxspeed[trainBnow]+"km/h max";
		document.testmeter.LLaccel.value=trainAcceleration[trainBnow]+"km/h/s";
		document.testmeter.LLdecel.value=-trainDeceleration[trainBnow]+"km/h/s";
	}else{
		document.testmeter.LLstopPos.value="";
		document.testmeter.LLlength.value="";
		if(Ronly){document.testmeter.LLnow.value="左行休止"}else{document.testmeter.LLnow.value="←画面外"}
		document.testmeter.LLstopSet.value="";
		document.testmeter.LLstopGo.value="";
		document.testmeter.LLmaxspeed.value="";
		document.testmeter.LLaccel.value="";
		document.testmeter.LLdecel.value="";
	}
	document.testmeter.delaypercent.value=meterStr;

}
